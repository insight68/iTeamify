name: iteamify

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: iteamify
      POSTGRES_USER: ${POSTGRES_USER:-iteamify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iteamify}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
