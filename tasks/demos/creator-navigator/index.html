<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Aurocreator bilingual creator navigator concept demo"
    />
    <title>Aurocreator · Creator Navigator Demo</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #141724;
        --ink-soft: #5f6573;
        --paper: #f5f1e9;
        --paper-strong: #fffdf8;
        --paper-blue: #edf0ff;
        --line: rgba(20, 23, 36, 0.13);
        --line-strong: rgba(20, 23, 36, 0.22);
        --blue: #5166d8;
        --blue-dark: #394cae;
        --coral: #ec6b59;
        --green: #26745a;
        --shadow: 0 28px 90px rgba(26, 29, 45, 0.12);
        --sans: "Avenir Next", Avenir, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        --serif: "Iowan Old Style", "Songti SC", STSong, Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 12% 7%, rgba(236, 107, 89, 0.14), transparent 28rem),
          radial-gradient(circle at 84% 17%, rgba(81, 102, 216, 0.15), transparent 30rem),
          var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      button,
      a {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(81, 102, 216, 0.42);
        outline-offset: 3px;
      }

      .shell {
        width: min(1320px, calc(100% - 40px));
        margin: 20px auto 64px;
        overflow: hidden;
        border: 1px solid rgba(20, 23, 36, 0.1);
        border-radius: 30px;
        background: rgba(255, 253, 248, 0.78);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px);
      }

      .topbar {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        position: relative;
        width: 28px;
        height: 28px;
        border: 1px solid var(--ink);
        border-radius: 50%;
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        content: "";
        background: var(--ink);
      }

      .brand-mark::before {
        width: 1px;
        height: 20px;
        left: 13px;
        top: 3px;
        transform: rotate(38deg);
      }

      .brand-mark::after {
        width: 5px;
        height: 5px;
        right: 4px;
        bottom: 4px;
        border-radius: 50%;
        background: var(--coral);
      }

      .concept-label {
        margin-left: 8px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink-soft);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .language-switch {
        display: flex;
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.52);
      }

      .language-switch button {
        min-width: 56px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        cursor: pointer;
        padding: 8px 10px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        transition: 160ms ease;
      }

      .language-switch button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
        box-shadow: 0 5px 14px rgba(20, 23, 36, 0.14);
      }

      .hero {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
        gap: 56px;
        padding: 84px 64px 68px;
        overflow: hidden;
      }

      .hero::after {
        position: absolute;
        width: 460px;
        height: 460px;
        right: -220px;
        bottom: -290px;
        border: 1px solid rgba(81, 102, 216, 0.18);
        border-radius: 50%;
        box-shadow:
          0 0 0 48px rgba(81, 102, 216, 0.035),
          0 0 0 96px rgba(81, 102, 216, 0.025);
        content: "";
      }

      .eyebrow,
      .section-kicker,
      .route-kicker,
      .panel-number {
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .hero h1 {
        max-width: 910px;
        margin: 22px 0 0;
        font-family: var(--serif);
        font-size: clamp(3.2rem, 6.5vw, 6.7rem);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.94;
      }

      .hero h1 em {
        display: inline-block;
        color: var(--blue);
        font-style: normal;
      }

      .hero-title-line {
        display: block;
      }

      .hero-copy {
        max-width: 720px;
        margin: 28px 0 0;
        color: var(--ink-soft);
        font-size: 17px;
        line-height: 1.8;
      }

      .logic-card {
        position: relative;
        z-index: 1;
        align-self: end;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.66);
      }

      .logic-card strong {
        display: block;
        margin-top: 12px;
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.25;
      }

      .logic-track {
        display: grid;
        gap: 9px;
        margin-top: 22px;
      }

      .logic-track span {
        position: relative;
        padding: 10px 12px 10px 34px;
        border-radius: 10px;
        background: var(--paper-blue);
        color: var(--blue-dark);
        font-size: 12px;
        font-weight: 700;
      }

      .logic-track span::before {
        position: absolute;
        left: 14px;
        top: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--blue);
        content: "";
        transform: translateY(-50%);
      }

      .navigator {
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.38);
      }

      .intent-row {
        padding: 34px 48px;
        border-bottom: 1px solid var(--line);
      }

      .intent-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
      }

      .intent-heading h2 {
        margin: 0;
        font-family: var(--serif);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }

      .intent-heading p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .intent-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      .intent-list button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        gap: 10px;
        padding: 10px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper-strong);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        transition: 180ms ease;
      }

      .intent-list button:hover {
        transform: translateY(-2px);
        border-color: var(--line-strong);
      }

      .intent-list button[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      .intent-dot {
        width: 8px;
        height: 8px;
        border: 2px solid currentColor;
        border-radius: 50%;
      }

      .route-grid {
        display: grid;
        grid-template-columns: minmax(290px, 0.74fr) minmax(0, 1.26fr);
      }

      .route-summary {
        display: flex;
        min-height: 610px;
        flex-direction: column;
        padding: 48px;
        border-right: 1px solid var(--line);
        background:
          linear-gradient(rgba(81, 102, 216, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(81, 102, 216, 0.04) 1px, transparent 1px),
          var(--paper-blue);
        background-size: 32px 32px;
      }

      .route-summary h3 {
        margin: 21px 0 0;
        font-family: var(--serif);
        font-size: clamp(2.15rem, 4vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .route-description {
        margin: 22px 0 0;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.8;
      }

      .route-metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        margin-top: 32px;
        overflow: hidden;
        border: 1px solid rgba(81, 102, 216, 0.18);
        border-radius: 14px;
        background: rgba(81, 102, 216, 0.16);
      }

      .metric {
        min-width: 0;
        padding: 14px;
        background: rgba(255, 255, 255, 0.72);
      }

      .metric-label {
        display: block;
        color: var(--ink-soft);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        overflow: hidden;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .route-note {
        margin-top: auto;
        padding-top: 36px;
      }

      .route-note-line {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--green);
        font-size: 12px;
        font-weight: 700;
      }

      .route-note-line::before {
        width: 22px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      .route-note p {
        margin: 11px 0 0;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.7;
      }

      .platform-panel {
        padding: 48px;
        background: rgba(255, 253, 248, 0.72);
      }

      .platform-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
      }

      .platform-heading h3 {
        margin: 8px 0 0;
        font-family: var(--serif);
        font-size: 31px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .platform-count {
        color: var(--ink-soft);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
      }

      .platform-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 26px;
      }

      .platform-card {
        position: relative;
        min-height: 192px;
        padding: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.64);
        cursor: pointer;
        text-align: left;
        transition: 180ms ease;
      }

      .platform-card::after {
        position: absolute;
        width: 84px;
        height: 84px;
        right: -30px;
        bottom: -38px;
        border: 1px solid var(--line);
        border-radius: 50%;
        content: "";
      }

      .platform-card:hover {
        transform: translateY(-3px);
        border-color: rgba(81, 102, 216, 0.34);
        box-shadow: 0 16px 32px rgba(20, 23, 36, 0.08);
      }

      .platform-card[aria-pressed="true"] {
        border-color: var(--blue);
        background: var(--paper-blue);
        box-shadow: inset 0 0 0 1px var(--blue);
      }

      .platform-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .platform-monogram {
        display: inline-flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: var(--ink);
        color: white;
        font-family: var(--serif);
        font-size: 18px;
      }

      .platform-card:nth-child(2) .platform-monogram {
        background: var(--coral);
      }

      .platform-card:nth-child(3) .platform-monogram {
        background: var(--blue);
      }

      .platform-card:nth-child(4) .platform-monogram {
        background: var(--green);
      }

      .selected-indicator {
        color: var(--blue);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        opacity: 0;
        text-transform: uppercase;
      }

      .platform-card[aria-pressed="true"] .selected-indicator {
        opacity: 1;
      }

      .platform-card h4 {
        margin: 17px 0 0;
        font-size: 17px;
        letter-spacing: -0.025em;
      }

      .platform-card p {
        margin: 9px 0 0;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1.6;
      }

      .platform-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 16px;
      }

      .platform-tags span {
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.62);
        color: var(--ink-soft);
        font-size: 9px;
        font-weight: 700;
      }

      .execution {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 0.82fr) minmax(360px, 1.18fr);
        gap: 70px;
        padding: 72px 64px;
        overflow: hidden;
        background: var(--ink);
        color: #fff;
      }

      .execution::before {
        position: absolute;
        width: 360px;
        height: 360px;
        left: -190px;
        top: -210px;
        border-radius: 50%;
        background: rgba(236, 107, 89, 0.17);
        filter: blur(70px);
        content: "";
      }

      .execution-copy,
      .plan-card {
        position: relative;
        z-index: 1;
      }

      .execution h2 {
        margin: 18px 0 0;
        font-family: var(--serif);
        font-size: clamp(2.6rem, 4.8vw, 5.2rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.98;
      }

      .execution-copy > p {
        max-width: 530px;
        margin: 24px 0 0;
        color: rgba(255, 255, 255, 0.6);
        font-size: 15px;
        line-height: 1.8;
      }

      .execution-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 31px;
      }

      .primary-action,
      .secondary-action {
        min-height: 46px;
        border-radius: 12px;
        cursor: pointer;
        padding: 11px 17px;
        font-size: 12px;
        font-weight: 800;
        transition: 180ms ease;
      }

      .primary-action {
        border: 1px solid #fff;
        background: #fff;
        color: var(--ink);
      }

      .primary-action:hover {
        transform: translateY(-2px);
        background: #f2f2f2;
      }

      .secondary-action {
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }

      .secondary-action:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .method-note {
        display: none;
        margin-top: 18px;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 11px;
        line-height: 1.7;
      }

      .method-note[data-open="true"] {
        display: block;
      }

      .plan-card {
        padding: 26px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.24);
      }

      .plan-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .plan-head strong {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 500;
      }

      .plan-head span {
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(100, 193, 148, 0.13);
        color: #8ed8b6;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .plan-list {
        display: grid;
        gap: 0;
        margin-top: 8px;
      }

      .plan-item {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 16px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .plan-item:last-child {
        border-bottom: 0;
      }

      .plan-index {
        display: inline-flex;
        width: 24px;
        height: 24px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.5);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 9px;
      }

      .plan-item p {
        margin: 2px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        line-height: 1.55;
      }

      .plan-item small {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.34);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .guardrail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 18px 24px;
        border-top: 1px solid var(--line);
        color: var(--ink-soft);
        font-size: 10px;
        line-height: 1.5;
      }

      .guardrail strong {
        color: var(--ink);
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 5;
        max-width: min(360px, calc(100vw - 48px));
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        background: var(--ink);
        box-shadow: 0 18px 48px rgba(20, 23, 36, 0.28);
        color: #fff;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
        transition: 180ms ease;
      }

      .toast[data-visible="true"] {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .hero,
        .execution {
          grid-template-columns: 1fr;
        }

        .hero {
          gap: 38px;
          padding: 68px 42px 52px;
        }

        .logic-card {
          max-width: 620px;
        }

        .route-grid {
          grid-template-columns: 1fr;
        }

        .route-summary {
          min-height: 500px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .execution {
          gap: 46px;
        }
      }

      @media (max-width: 680px) {
        .shell {
          width: 100%;
          margin: 0;
          border: 0;
          border-radius: 0;
        }

        .topbar {
          min-height: 64px;
          padding: 12px 16px;
        }

        .concept-label {
          display: none;
        }

        .hero {
          padding: 62px 20px 40px;
        }

        .hero h1 {
          font-size: clamp(3rem, 15vw, 4.8rem);
        }

        .logic-card {
          padding: 20px;
        }

        .intent-row,
        .route-summary,
        .platform-panel,
        .execution {
          padding: 36px 20px;
        }

        .intent-heading,
        .platform-heading,
        .guardrail {
          align-items: flex-start;
          flex-direction: column;
        }

        .intent-list {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .intent-list button {
          justify-content: flex-start;
          border-radius: 14px;
        }

        .route-summary {
          min-height: auto;
        }

        .route-note {
          margin-top: 50px;
        }

        .route-metrics {
          grid-template-columns: 1fr;
        }

        .platform-list {
          grid-template-columns: 1fr;
        }

        .platform-card {
          min-height: 174px;
        }

        .execution {
          grid-template-columns: minmax(0, 1fr);
        }

        .plan-card {
          padding: 20px;
        }

        .plan-item {
          grid-template-columns: 26px 1fr;
        }

        .plan-item small {
          display: none;
        }

        .guardrail {
          padding: 18px 20px 28px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .hero-copy,
        .logic-card,
        .navigator,
        .execution {
          animation: reveal 520ms both;
        }

        .logic-card {
          animation-delay: 80ms;
        }

        .navigator {
          animation-delay: 140ms;
        }

        .execution {
          animation-delay: 200ms;
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand" aria-label="Aurocreator">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Auro<strong>creator</strong></span>
          <span class="concept-label">#workflow concept</span>
        </div>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-locale="zh" aria-pressed="true">中文</button>
          <button type="button" data-locale="en" aria-pressed="false">EN</button>
        </div>
      </header>

      <main>
        <section class="hero">
          <div>
            <div class="eyebrow" id="heroEyebrow"></div>
            <h1 id="heroTitle"></h1>
            <p class="hero-copy" id="heroCopy"></p>
          </div>
          <aside class="logic-card" aria-labelledby="logicTitle">
            <span class="section-kicker" id="logicKicker"></span>
            <strong id="logicTitle"></strong>
            <div class="logic-track" id="logicTrack"></div>
          </aside>
        </section>

        <section class="navigator" aria-labelledby="intentTitle">
          <div class="intent-row">

            (intent) => `
              <button type="button" data-intent="${intent.id}" aria-pressed="${intent.id === state.intent[state.locale]}">
                <span class="intent-dot" aria-hidden="true"></span>${intent.label}
              </button>`,

        $("routeKicker").textContent = copy.routeKicker;
        $("routeTitle").textContent = route.title;
        $("routeDescription").textContent = route.description;
        $("routeMetrics").innerHTML = route.metrics

                <span class="platform-tags">${tags.map((tag) => `<span>${tag}</span>`).join("")}</span>

        $("guardrail").textContent = copy.guardrail;
        bindDynamicEvents();

      function bindDynamicEvents() {
        document.querySelectorAll("[data-intent]").forEach((button) => {
          button.addEventListener("click", () => {
            state.intent[state.locale] = button.dataset.intent;
            state.selectedPlatform = 0;
            render();
          });
        });
        document.querySelectorAll("[data-platform]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedPlatform = Number(button.dataset.platform);
            document.querySelectorAll("[data-platform]").forEach((candidate) => {
              candidate.setAttribute("aria-pressed", String(candidate === button));
            });
          });
        });
      }

      document.querySelectorAll("[data-locale]").forEach((button) => {
        button.addEventListener("click", () => {
          state.locale = button.dataset.locale;
          state.selectedPlatform = 0;
          render();
        });
      });

      $("methodAction").addEventListener("click", () => {
        const isOpen = $("methodNote").dataset.open === "true";
        $("methodNote").dataset.open = String(!isOpen);
        $("methodAction").setAttribute("aria-expanded", String(!isOpen));
      });

      let toastTimer;
      $("primaryAction").addEventListener("click", () => {
        const toast = $("toast");
        toast.textContent = localeCopy[state.locale].toast;
        toast.dataset.visible = "true";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.dataset.visible = "false";
        }, 2600);
      });

      render();
    </script>
